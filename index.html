<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collection of Stories — Cinematic Exhibition</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Pinyon+Script&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root {
    --gold: #C2A38E;
    --gold-soft: #DAC6B5;
    --bg: #090808;
    --panel: #11100F;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: white;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

::-webkit-scrollbar {
    width: 3px;
}

::-webkit-scrollbar-thumb {
    background: var(--gold);
}

.font-cinzel {
    font-family: 'Cinzel', serif;
}

.font-cormorant {
    font-family: 'Cormorant Garamond', serif;
}

.font-script {
    font-family: 'Pinyon Script', cursive;
}

.room {
    position: absolute;
    inset: 0;
    transition:
        opacity 1.1s ease,
        transform 1.4s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.2s ease;
}

.room.hidden-room {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.05);
    filter: blur(12px);
}

.gallery-bg {
    background:
        linear-gradient(to right,
        rgba(0,0,0,0.94),
        rgba(0,0,0,0.62)),
        url('https://github.com/mynrjad/artist-gallery-website/blob/main/artistwp.png?raw=true');

    background-size: cover;
    background-position: center;
}

.depth-fog {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at center,
        transparent 20%,
        rgba(0,0,0,0.15) 60%,
        rgba(0,0,0,0.55) 100%);

    mix-blend-mode: multiply;
}

.gallery-lighting {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 50% 35%,
        rgba(255,220,180,0.12),
        transparent 50%);

    mix-blend-mode: screen;
}

.museum-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.18;
    background-image:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.03) 0px,
            rgba(255,255,255,0.03) 30px,
            transparent 30px,
            transparent 60px
        );
}

.carousel-container {
    perspective: 2400px;
}

.carousel-anchor {
    position: relative;
    width: 340px;
    height: 460px;
    transform-style: preserve-3d;
    will-change: transform;
}

.frame-card {
    position: absolute;
    inset: 0;
    transition:
        transform 1s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.8s ease,
        filter 0.8s ease;

    cursor: pointer;
}

.frame-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    transition: transform 1s ease;
}

.frame-card:hover img {
    transform: scale(1.03);
}

.gallery-label {
    position: absolute;
    top: 10%;
    text-align: center;
    z-index: 20;
}

.gallery-label h1 {
    font-size: clamp(3rem, 5vw, 5rem);
    color: var(--gold-soft);
    margin: 0;
}

.gallery-label p {
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
}

.nav-btn {
    width: 52px;
    height: 52px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.85);
    color: var(--gold-soft);
    cursor: pointer;
    transition: all 0.4s ease;
}

.nav-btn:hover {
    transform: scale(1.05);
    background: rgba(194,163,142,0.15);
}

.exhibition-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 4rem;
    padding-bottom: 8rem;
}

.painting-card {
    position: relative;
    overflow: hidden;
    transition: all 0.8s ease;
    cursor: zoom-in;
}

.painting-card:hover {
    transform: translateY(-12px) scale(1.02);
}

.painting-card::after {
    content: 'INSPECT';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: end;
    justify-content: center;
    padding-bottom: 2rem;
    letter-spacing: 0.35em;
    font-size: 10px;
    font-family: 'Cinzel', serif;
    opacity: 0;
    transition: opacity 0.6s ease;
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent 40%);
}

.painting-card:hover::after {
    opacity: 1;
}

.painting-card img {
    width: 100%;
    max-height: 620px;
    object-fit: contain;
    transition: transform 1.2s ease;
}

.painting-card:hover img {
    transform: scale(1.05);
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.96);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 2rem;
}

.modal.active {
    display: flex;
}

.modal-panel {
    width: min(1200px, 100%);
    background: #F7F1EB;
    color: black;
    overflow: hidden;
}

.modal-img {
    max-height: 70vh;
    transition: transform 12s ease;
}

.modal-img:hover {
    transform: scale(1.08);
}

.fade-enter {
    animation: fadeEnter 1.4s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes fadeEnter {
    from {
        opacity: 0;
        transform: scale(1.06);
        filter: blur(12px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px);
    }
}

.dust {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 999px;
    background: rgba(255,255,255,0.25);
    animation: drift linear infinite;
}

@keyframes drift {
    from {
        transform: translateY(0px);
        opacity: 0;
    }

    20% {
        opacity: 0.6;
    }

    to {
        transform: translateY(-120px);
        opacity: 0;
    }
}

</style>
</head>

<body>

<audio id="ambience" loop>
    <source src="assets/audio/museum-ambience.mp3" type="audio/mpeg">
</audio>

<audio id="hoverSound">
    <source src="assets/audio/frame-hover.mp3" type="audio/mpeg">
</audio>

<audio id="transitionSound">
    <source src="assets/audio/transition.mp3" type="audio/mpeg">
</audio>

<header class="fixed top-0 left-0 right-0 h-16 z-50 border-b border-white/10 bg-black/70 backdrop-blur-md flex items-center justify-between px-8">

<div class="font-cinzel text-xs tracking-[0.4em] uppercase text-[#DAC6B5]">
Collection of Stories
</div>

<nav class="flex gap-8 text-[10px] uppercase tracking-[0.3em] text-white/60">
<button onclick="showRoom('gallery')">Gallery</button>
<button onclick="showRoom('dossier')">Dossier</button>
</nav>

</header>

<section id="galleryRoom" class="room gallery-bg flex items-center justify-center">

<div class="museum-pattern"></div>
<div class="depth-fog"></div>
<div class="gallery-lighting"></div>

<div id="dustLayer"></div>

<div class="gallery-label">
    <h1 id="artistName" class="font-script">Leonardo Da Vinci</h1>
    <p id="artistEra">HIGH RENAISSANCE • 1452 — 1519</p>
</div>

<button class="nav-btn absolute left-10 z-20" onclick="changeSlide(-1)">
←
</button>

<div class="carousel-container z-10">
    <div id="carouselAnchor" class="carousel-anchor"></div>
</div>

<button class="nav-btn absolute right-10 z-20" onclick="changeSlide(1)">
→
</button>

</section>

<section id="exhibitionRoom" class="room hidden-room bg-[#090808] overflow-y-auto">

<div class="min-h-full px-8 py-32 max-w-7xl mx-auto">

<div class="text-center mb-20">
<h2 id="exhibitTitle" class="font-script text-7xl text-[#DAC6B5]"></h2>
<p id="exhibitPitch" class="font-cormorant text-2xl italic text-white/70 max-w-4xl mx-auto mt-6 leading-relaxed"></p>
</div>

<div id="paintingGrid" class="exhibition-grid"></div>

</div>

</section>

<section id="dossierRoom" class="room hidden-room bg-[#F5EEE8] text-black overflow-y-auto">
<div class="max-w-4xl mx-auto py-32 px-10">
<h2 class="font-cinzel tracking-[0.4em] uppercase text-sm mb-10">
Exhibition Dossier
</h2>

<p class="font-cormorant text-2xl leading-relaxed italic">
This exhibition transforms traditional gallery browsing into a cinematic archival experience focused on atmosphere, spatial storytelling, and immersive interaction.
</p>
</div>
</section>

<div id="modal" class="modal">

<div class="modal-panel grid md:grid-cols-2">

<div class="bg-black flex items-center justify-center p-10">
<img id="modalImg" class="modal-img" src="">
</div>

<div class="p-10 flex flex-col justify-between">

<div>
<h3 id="modalTitle" class="font-cinzel text-3xl mb-3"></h3>
<p id="modalYear" class="uppercase tracking-[0.3em] text-xs text-black/50 mb-8"></p>
<p id="modalAnalysis" class="font-cormorant text-2xl italic leading-relaxed text-black/75"></p>
</div>

<div class="pt-8 border-t border-black/10">
<p id="modalMedium" class="mb-2"></p>
<p id="modalLocation"></p>
</div>

</div>

</div>

<button onclick="closeModal()" class="absolute top-8 right-8 text-white text-3xl">
×
</button>

</div>

<script>

const collection = [
{
    name: 'Leonardo Da Vinci',
    dates: '1452 — 1519',
    era: 'High Renaissance',
    frameUrl: 'https://github.com/mynrjad/artist-gallery-website/blob/main/Da%20Vinci%20With%20Frame.png?raw=true',
    pitch: 'The legendary Renaissance polymath blending mathematics, anatomy, perspective, and emotional realism into timeless masterworks.',

    paintings: [
        {
            title: 'Mona Lisa',
            year: '1503 — 1519',
            medium: 'Oil on Poplar Panel',
            location: 'Louvre Museum, Paris',
            imageUrl: 'https://github.com/mynrjad/artist-gallery-website/blob/main/Mona_Lisa.png?raw=true',
            analysis: 'Leonardo uses sfumato transitions and subtle atmospheric perspective to create the most enigmatic portrait in art history.'
        },
        {
            title: 'The Last Supper',
            year: '1495 — 1498',
            medium: 'Tempera and Gesso',
            location: 'Santa Maria delle Grazie, Milan',
            imageUrl: 'https://github.com/mynrjad/artist-gallery-website/blob/main/last%20supper.jpg?raw=true',
            analysis: 'A monumental spatial composition capturing the emotional fracture of betrayal.'
        }
    ]
},

{
    name: 'Vincent Van Gogh',
    dates: '1853 — 1890',
    era: 'Post-Impressionism',
    frameUrl: 'https://github.com/mynrjad/artist-gallery-website/blob/main/Van%20Gogh%20With%20Frame.png?raw=true',
    pitch: 'Van Gogh transformed emotional intensity into rhythmic brushwork and explosive color.',

    paintings: [
        {
            title: 'The Starry Night',
            year: '1889',
            medium: 'Oil on Canvas',
            location: 'Museum of Modern Art, New York',
            imageUrl: 'https://github.com/mynrjad/artist-gallery-website/blob/main/starry%20night.jpg?raw=true',
            analysis: 'Swirling celestial movement transforms the night sky into psychological motion.'
        },
        {
            title: 'Sunflowers',
            year: '1888',
            medium: 'Oil on Canvas',
            location: 'Van Gogh Museum, Amsterdam',
            imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/4/40/Vincent_Willem_van_Gogh_128.jpg',
            analysis: 'A celebration of warmth, mortality, and expressive color harmony.'
        }
    ]
},

{
    name: 'Claude Monet',
    dates: '1840 — 1926',
    era: 'French Impressionism',
    frameUrl: 'https://github.com/mynrjad/artist-gallery-website/blob/main/Da%20Vinci%20With%20Frame.png?raw=true',
    pitch: 'Monet devoted his life to capturing light, atmosphere, and fleeting environmental changes.',

    paintings: [
        {
            title: 'Impression, Sunrise',
            year: '1872',
            medium: 'Oil on Canvas',
            location: 'Musée Marmottan Monet',
            imageUrl: 'https://github.com/mynrjad/artist-gallery-website/blob/main/Impression%20sunrise.png?raw=true',
            analysis: 'The foundational painting of Impressionism itself.'
        }
    ]
}
];

let activeIndex = 0;

const rooms = {
    gallery: document.getElementById('galleryRoom'),
    exhibition: document.getElementById('exhibitionRoom'),
    dossier: document.getElementById('dossierRoom')
};

const audio = {
    ambience: document.getElementById('ambience'),
    hover: document.getElementById('hoverSound'),
    transition: document.getElementById('transitionSound')
};

function initializeAudio() {
    document.body.addEventListener('click', () => {
        audio.ambience.volume = 0.2;

        audio.ambience.play().catch(() => {});
    }, { once: true });
}

initializeAudio();

function preloadAssets() {
    collection.forEach(artist => {

        const frame = new Image();
        frame.src = artist.frameUrl;

        artist.paintings.forEach(work => {
            const img = new Image();
            img.src = work.imageUrl;
        });
    });
}

preloadAssets();

function renderCarousel() {

    const anchor = document.getElementById('carouselAnchor');

    anchor.innerHTML = '';

    collection.forEach((artist, index) => {

        const card = document.createElement('div');

        card.className = 'frame-card';

        const diff = index - activeIndex;

        let transform = '';
        let opacity = 1;
        let filter = 'brightness(0.18) blur(3px)';

        if(diff === 0) {
            transform = 'translateZ(140px) scale(1.08)';
            filter = 'brightness(1)';
        }
        else if(diff === -1) {
            transform = 'translateX(-180px) rotateY(24deg) scale(0.84)';
        }
        else if(diff === 1) {
            transform = 'translateX(180px) rotateY(-24deg) scale(0.84)';
        }
        else {
            opacity = 0;
            transform = 'translateZ(-400px)';
        }

        card.style.transform = transform;
        card.style.opacity = opacity;
        card.style.filter = filter;

        card.innerHTML = `
            <img src="${artist.frameUrl}">
        `;

        card.addEventListener('mouseenter', () => {
            audio.hover.currentTime = 0;
            audio.hover.volume = 0.25;
            audio.hover.play().catch(() => {});
        });

        card.onclick = () => {
            if(index === activeIndex) {
                openExhibition();
            }
            else {
                activeIndex = index;
                renderCarousel();
            }
        };

        anchor.appendChild(card);
    });

    const artist = collection[activeIndex];

    document.getElementById('artistName').textContent = artist.name;
    document.getElementById('artistEra').textContent = `${artist.era} • ${artist.dates}`;
}

function changeSlide(direction) {

    activeIndex += direction;

    if(activeIndex < 0) {
        activeIndex = collection.length - 1;
    }

    if(activeIndex >= collection.length) {
        activeIndex = 0;
    }

    renderCarousel();
}

function showRoom(target) {

    audio.transition.currentTime = 0;
    audio.transition.volume = 0.35;
    audio.transition.play().catch(() => {});

    Object.values(rooms).forEach(room => {
        room.classList.add('hidden-room');
    });

    rooms[target].classList.remove('hidden-room');
    rooms[target].classList.add('fade-enter');

    setTimeout(() => {
        rooms[target].classList.remove('fade-enter');
    }, 1500);
}

function openExhibition() {

    const artist = collection[activeIndex];

    document.getElementById('exhibitTitle').textContent = artist.name;
    document.getElementById('exhibitPitch').textContent = artist.pitch;

    const grid = document.getElementById('paintingGrid');

    grid.innerHTML = '';

    artist.paintings.forEach((painting, index) => {

        const item = document.createElement('div');

        item.className = 'painting-card';

        item.innerHTML = `
            <img src="${painting.imageUrl}">
        `;

        item.onclick = () => {
            openModal(painting);
        };

        grid.appendChild(item);
    });

    showRoom('exhibition');
}

function openModal(painting) {

    document.getElementById('modal').classList.add('active');

    document.getElementById('modalImg').src = painting.imageUrl;
    document.getElementById('modalTitle').textContent = painting.title;
    document.getElementById('modalYear').textContent = painting.year;
    document.getElementById('modalAnalysis').textContent = painting.analysis;
    document.getElementById('modalMedium').textContent = painting.medium;
    document.getElementById('modalLocation').textContent = painting.location;
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

const carouselAnchor = document.getElementById('carouselAnchor');
const galleryRoom = document.getElementById('galleryRoom');

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

galleryRoom.addEventListener('mousemove', (e) => {

    const rect = galleryRoom.getBoundingClientRect();

    targetX = ((e.clientX - rect.width / 2) / rect.width) * 10;
    targetY = ((e.clientY - rect.height / 2) / rect.height) * 10;
});

function animateParallax() {

    currentX += (targetX - currentX) * 0.06;
    currentY += (targetY - currentY) * 0.06;

    carouselAnchor.style.transform = `
        rotateY(${currentX}deg)
        rotateX(${-currentY}deg)
    `;

    requestAnimationFrame(animateParallax);
}

animateParallax();

function createDustParticles() {

    const layer = document.getElementById('dustLayer');

    for(let i = 0; i < 40; i++) {

        const dust = document.createElement('div');

        dust.className = 'dust';

        dust.style.left = Math.random() * 100 + '%';
        dust.style.top = Math.random() * 100 + '%';
        dust.style.animationDuration = (6 + Math.random() * 8) + 's';
        dust.style.animationDelay = Math.random() * 10 + 's';

        layer.appendChild(dust);
    }
}

createDustParticles();

renderCarousel();

</script>

</body>
</html>
